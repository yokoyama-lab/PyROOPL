name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The interpreter is pure standard-library Python and the tests import
      # `pyrooplpp` from the repository root (and run `python3 main.py`
      # via subprocess), so only pytest is needed.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=7.0"

      - name: Run tests
        run: python -m pytest -q
